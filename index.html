<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 지갑</title>
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘의 지갑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.WALLET_APP = true;</script>
</head>
<body>
<style>
/* Layout: 토스식 앱 화면. 회색 바탕 위에 흰 카드가 쌓이고, 모바일은 하단 탭바(홈·고민함·리포트·내역),
   넓은 화면은 상단 탭 + 2열. 입력·설정은 아래에서 올라오는 시트. */
:root {
  --bg: #f2f4f6;
  --card: #ffffff;
  --fill: #f2f4f6;
  --fill-2: #e5e8eb;
  --ink: #191f28;
  --ink-2: #333d4b;
  --sub: #4e5968;
  --mute: #8b95a1;
  --faint: #b0b8c1;
  --line: #e5e8eb;
  --blue: #3182f6;
  --blue-press: #1b64da;
  --blue-soft: #e8f3ff;
  --on-blue: #ffffff;
  --red: #f04452;
  --red-soft: #ffeeef;
  --orange: #f59300;
  --orange-soft: #fff4e2;
  --green: #03b26c;
  --green-soft: #e3f8ee;
  --dim: rgba(0, 10, 30, .45);
  --snack: #333d4b;
  --on-snack: #ffffff;
  --shadow: 0 1px 2px rgba(0, 20, 50, .04);
  --c-food: #3182f6;
  --c-cafe: #8e6cef;
  --c-deliv: #f66570;
  --c-shop: #ffa42b;
  --c-trans: #18b6a4;
  --c-etc: #a6b0bb;
  --font: "Toss Product Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --r-card: 22px;
  --r-ctl: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101013; --card: #1d1d22; --fill: #2a2a31; --fill-2: #36363f;
    --ink: #f4f5f7; --ink-2: #dfe1e5; --sub: #b0b6be; --mute: #82858d; --faint: #5b5e66; --line: #2a2a31;
    --blue: #4c95fb; --blue-press: #6aa8ff; --blue-soft: rgba(76, 149, 251, .16); --on-blue: #ffffff;
    --red: #ff6b75; --red-soft: rgba(255, 107, 117, .15); --orange: #ffad3a; --orange-soft: rgba(255, 173, 58, .14);
    --green: #2fcb8b; --green-soft: rgba(47, 203, 139, .14); --dim: rgba(0, 0, 0, .6);
    --snack: #3a3a44; --on-snack: #ffffff; --shadow: none;
    --c-food: #4c95fb; --c-cafe: #a58bf5; --c-deliv: #ff7d86; --c-shop: #ffb54f; --c-trans: #2cc9b6; --c-etc: #7f8892;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101013; --card: #1d1d22; --fill: #2a2a31; --fill-2: #36363f;
  --ink: #f4f5f7; --ink-2: #dfe1e5; --sub: #b0b6be; --mute: #82858d; --faint: #5b5e66; --line: #2a2a31;
  --blue: #4c95fb; --blue-press: #6aa8ff; --blue-soft: rgba(76, 149, 251, .16); --on-blue: #ffffff;
  --red: #ff6b75; --red-soft: rgba(255, 107, 117, .15); --orange: #ffad3a; --orange-soft: rgba(255, 173, 58, .14);
  --green: #2fcb8b; --green-soft: rgba(47, 203, 139, .14); --dim: rgba(0, 0, 0, .6);
  --snack: #3a3a44; --on-snack: #ffffff; --shadow: none;
  --c-food: #4c95fb; --c-cafe: #a58bf5; --c-deliv: #ff7d86; --c-shop: #ffb54f; --c-trans: #2cc9b6; --c-etc: #7f8892;
  color-scheme: dark;
}

:root { --stage: #dfe3e8; --bezel: #15171c; --bezel-edge: #2c2f36; }
:root[data-theme="dark"] { --stage: #060608; --bezel: #000; --bezel-edge: #34363d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #060608; --bezel: #000; --bezel-edge: #34363d; } }

* { box-sizing: border-box; }
html, body { background: var(--bg); margin: 0; height: 100%; }
body {
  color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; word-break: keep-all;
  overflow: hidden;
}

/* ── 휴대폰 껍데기: 폰에서는 전체 화면, 넓은 화면에서는 가운데 폰 틀 ── */
.stage { height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; }
.phone { position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; isolation: isolate; }
.statusbar { display: none; flex: none; height: 50px; padding: 0 30px 0 34px; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; position: relative; z-index: 6; background: var(--bg); }
.island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 110px; height: 31px; border-radius: 99px; background: #000; }
.sys { display: inline-flex; gap: 6px; align-items: center; }
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.screen::-webkit-scrollbar { display: none; }
@media (min-width: 520px) and (min-height: 640px) and (hover: hover) and (pointer: fine) and (display-mode: browser) {
  .stage { background: var(--stage); padding: 28px; }
  .phone { width: 402px; height: min(874px, 100%); border-radius: 52px;
    box-shadow: 0 0 0 11px var(--bezel), 0 0 0 12.5px var(--bezel-edge), 0 40px 90px rgba(0, 20, 50, .28); }
  .statusbar { display: flex; }
}
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

/* ── 뼈대 ── */
.app { display: flex; flex-direction: column; gap: 12px; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 56px; margin: 0 -16px; padding: env(safe-area-inset-top, 0px) 12px 0 20px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.topbar .date { color: var(--mute); font-size: 14px; font-weight: 500; }
.brand { font-weight: 800; font-size: 19px; letter-spacing: -0.03em; }
.brand b { color: var(--blue); }
.topbar .spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--sub); }
.icon-btn:hover { background: var(--fill); }
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; padding: 2px 4px 0; }
.page-sub { color: var(--mute); font-size: 14px; padding: 0 4px 4px; }

.card { background: var(--card); border-radius: var(--r-card); padding: 22px 20px; box-shadow: var(--shadow); min-width: 0; }
.card.tight { padding: 8px 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.card.tight .card-head { padding: 14px 20px 4px; margin: 0; }
.card-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.more { color: var(--mute); font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }
.more:hover { color: var(--sub); }

/* ── 버튼 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 54px; padding: 0 20px; border-radius: var(--r-ctl); font-weight: 600; font-size: 16px; transition: background .15s, transform .1s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--blue); color: var(--on-blue); }
.btn.primary:hover:not(:disabled) { background: var(--blue-press); }
.btn.primary:disabled { opacity: .4; }
.btn.soft { background: var(--blue-soft); color: var(--blue); }
.btn.grey { background: var(--fill); color: var(--ink-2); }
.btn.grey:hover { background: var(--fill-2); }
.btn.block { width: 100%; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn-row { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1; }

/* ── 홈: 오늘 쓸 수 있는 돈 ── */
.today .eyebrow { color: var(--sub); font-size: 15px; font-weight: 500; }
.big { font-size: clamp(34px, 9vw, 42px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.big small { font-size: .62em; font-weight: 700; margin-left: 2px; }
.big.over { color: var(--red); }
.status { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 8px; }
.status.ok { color: var(--blue); background: var(--blue-soft); }
.status.warn { color: var(--orange); background: var(--orange-soft); }
.status.bad { color: var(--red); background: var(--red-soft); }
.meter { height: 8px; border-radius: 99px; background: var(--fill); overflow: hidden; margin-top: 18px; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--blue); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.meter.warn i { background: var(--orange); }
.meter.bad i { background: var(--red); }
.meter-scale { display: flex; justify-content: space-between; color: var(--mute); font-size: 13px; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 20px 0 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.stats > div { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; min-width: 0; }
.stats > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
.stats dt { color: var(--mute); font-size: 13px; }
.stats dd { margin: 0; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats dd.neg { color: var(--red); }

/* 홈 히어로: 파란 카드 */
.today.hero { background: linear-gradient(155deg, #3d8cff 0%, #2f74ec 55%, #1f5fd6 100%); color: #fff; box-shadow: 0 14px 30px -12px rgba(31, 95, 214, .55); position: relative; overflow: hidden; }
.today.hero.bad { background: linear-gradient(155deg, #ff6370 0%, #ef4251 60%, #d92f40 100%); box-shadow: 0 14px 30px -12px rgba(217, 47, 64, .5); }
.today.hero::after { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .09); pointer-events: none; }
.hero .eyebrow { color: rgba(255, 255, 255, .82); }
.hero .big, .hero .big.over { color: #fff; }
.hero .status { background: rgba(255, 255, 255, .18); color: #fff; }
.hero .status.warn { background: #fff; color: var(--orange); }
.hero .meter { background: rgba(255, 255, 255, .24); }
.hero .meter i, .hero .meter.bad i { background: #fff; }
.hero .meter.warn i { background: #ffd27a; }
.hero .meter-scale { color: rgba(255, 255, 255, .78); }
.hero .stats { border-top-color: rgba(255, 255, 255, .22); }
.hero .stats > div + div { border-left-color: rgba(255, 255, 255, .22); }
.hero .stats dt { color: rgba(255, 255, 255, .72); }
.hero .stats dd, .hero .stats dd.neg { color: #fff; }
.hero .btn.primary { background: #fff; color: #1f5fd6; }
.hero .btn.primary:hover { background: #f0f6ff; }
.hero.bad .btn.primary { color: #d92f40; }

.pace-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); }
.pace-line b { color: var(--ink); font-weight: 700; }
.pace-bar { position: relative; height: 10px; border-radius: 99px; background: var(--fill); margin: 12px 0 10px; }
.pace-bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--blue); }
.pace-bar.ahead i { background: var(--orange); }
.pace-bar.bad i { background: var(--red); }
.pace-bar s { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink-2); border-radius: 2px; }
.pace-note { font-size: 14px; color: var(--mute); }

/* ── 리스트 행 (토스식) ── */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; min-height: 64px; }
.row.btnrow { width: 100%; text-align: left; border-radius: 0; }
.row.btnrow:hover { background: var(--fill); }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; background: var(--cat, var(--faint)); }
.avatar.soft { background: var(--fill); color: var(--sub); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font-weight: 600; font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-end { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.row-amt { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.row-amt.neg, .neg { color: var(--red); }
.row-amt.blue { color: var(--blue); }
.mini-bar { width: 72px; height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--cat, var(--blue)); border-radius: inherit; }
.mini-bar.warn i { background: var(--orange); }
.mini-bar.over i { background: var(--red); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--fill); color: var(--sub); }
.pill.warn { background: var(--orange-soft); color: var(--orange); }
.pill.over, .pill.bad { background: var(--red-soft); color: var(--red); }
.pill.good { background: var(--green-soft); color: var(--green); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.empty { color: var(--mute); font-size: 15px; padding: 18px 20px 20px; line-height: 1.6; }
.empty .btn { margin-top: 14px; }
.foot-note { color: var(--mute); font-size: 13px; padding: 4px 20px 12px; }

/* 홈 바로가기 행 */
.shortcut { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
.shortcut .row-main { gap: 2px; }
.chev { color: var(--faint); flex: none; }

/* ── 시트 ── */
.dim { position: absolute; inset: 0; background: var(--dim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; scrollbar-width: none; background: var(--card); border-radius: 28px 28px 0 0; padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px)); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); animation: up .3s cubic-bezier(.2, .8, .2, 1); }
.sheet::-webkit-scrollbar { display: none; }
@media (min-width: 520px) and (min-height: 640px) and (hover: hover) and (pointer: fine) and (display-mode: browser) { .sheet { padding-bottom: 34px; } }
.grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--fill-2); margin: 0 auto 16px; }
.sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }

.amount-in { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--line); padding-bottom: 8px; transition: border-color .15s; }
.amount-in:focus-within { border-color: var(--blue); }
.amount-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; padding: 0; }
.amount-in input::placeholder { color: var(--faint); }
.amount-in span { font-size: 26px; font-weight: 700; color: var(--sub); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 24px; }
.chip { height: 34px; padding: 0 14px; border-radius: 99px; background: var(--fill); color: var(--ink-2); font-size: 14px; font-weight: 600; }
.chip:hover { background: var(--fill-2); }
.label { font-size: 14px; color: var(--sub); font-weight: 600; margin-bottom: 10px; display: block; }
.cat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; }
.cat-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 14px; font-size: 13px; color: var(--sub); font-weight: 600; }
.cat-btn .avatar { width: 44px; height: 44px; background: var(--fill); color: var(--mute); transition: background .15s, color .15s, transform .15s; }
.cat-btn[aria-pressed="true"] { color: var(--ink); }
.cat-btn[aria-pressed="true"] .avatar { background: var(--cat); color: #fff; transform: scale(1.06); }
.field-in { width: 100%; height: 52px; border-radius: var(--r-ctl); border: 0; background: var(--fill); padding: 0 16px; font-size: 16px; outline: 0; }
.field-in:focus { box-shadow: inset 0 0 0 2px var(--blue); background: var(--card); }
.field-in::placeholder { color: var(--faint); }
.hint { margin-top: 12px; font-size: 14px; color: var(--sub); background: var(--fill); padding: 12px 14px; border-radius: 12px; }
.hint b { font-weight: 700; color: var(--ink); }
.hint.warn { background: var(--orange-soft); color: var(--orange); }
.hint.warn b, .hint.over b { color: inherit; }
.hint.over { background: var(--red-soft); color: var(--red); }
.nudge { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--blue-soft); color: var(--blue); font-size: 14px; font-weight: 600; }
.nudge span { flex: 1; }
.err { color: var(--red); font-size: 14px; min-height: 20px; margin-top: 10px; }
.sheet-cta { margin-top: 10px; }

.money-field { display: flex; align-items: center; height: 52px; background: var(--fill); border-radius: var(--r-ctl); padding: 0 16px; gap: 4px; }
.money-field:focus-within { box-shadow: inset 0 0 0 2px var(--blue); background: var(--card); }
.money-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.money-field input::placeholder { color: var(--faint); font-weight: 500; }
.money-field em { font-style: normal; color: var(--sub); }
.lim-list { display: flex; flex-direction: column; gap: 10px; }
.lim-row { display: flex; align-items: center; gap: 12px; }
.lim-row .avatar { width: 36px; height: 36px; font-size: 14px; }
.lim-row .nm { width: 44px; font-weight: 600; }
.lim-row .money-field { flex: 1; min-width: 0; height: 46px; }
.alloc { margin-top: 14px; font-size: 14px; color: var(--sub); }
.alloc.neg { color: var(--red); }
.split { color: var(--blue); font-weight: 600; font-size: 14px; }
.section-gap { margin-top: 26px; }
.rules { margin: 22px 0 0; padding: 14px 16px 14px 32px; background: var(--fill); border-radius: 14px; color: var(--sub); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

/* ── 고민함 ── */
.saved-hero { display: flex; flex-direction: column; gap: 4px; }
.saved-hero .eyebrow { color: var(--sub); font-size: 15px; }
.saved-hero .big { color: var(--green); }
.saved-meta { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.wish-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; }
.wish-row + .wish-row { border-top: 1px solid var(--line); }
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring-track { stroke: var(--fill); }
.ring-fill { stroke: var(--blue); transition: stroke-dashoffset .6s; }
.ready .ring-fill { stroke: var(--green); }
.ring-label { font-size: 12px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
.ready .ring-label { color: var(--green); }
.wish-acts { display: flex; gap: 6px; flex: none; }
.wish-form { display: flex; flex-direction: column; gap: 10px; }
.wish-form-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

/* ── 리포트 ── */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { height: 36px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--mute); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.report-head { margin: 22px 0 4px; }
.report-head .eyebrow { color: var(--sub); font-size: 15px; }
.report-head .big { font-size: 30px; }
.delta { font-size: 14px; color: var(--sub); margin-top: 4px; }
.delta b.up { color: var(--red); }
.delta b.down { color: var(--blue); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; height: 170px; align-items: end; margin-top: 18px; }
.bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; border-radius: 10px; padding-top: 4px; }
.bar .col { width: min(100%, 34px); border-radius: 8px 8px 4px 4px; background: var(--fill-2); min-height: 4px; transition: height .5s cubic-bezier(.2, .8, .2, 1), background .15s; }
.bar:hover .col { background: var(--faint); }
.bar[aria-pressed="true"] .col { background: var(--blue); }
.bar .v { font-size: 12px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; visibility: hidden; white-space: nowrap; }
.bar[aria-pressed="true"] .v { visibility: visible; }
.bar .k { font-size: 12px; color: var(--mute); white-space: nowrap; }
.bar[aria-pressed="true"] .k { color: var(--ink); font-weight: 700; }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--fill); gap: 2px; margin: 4px 0 6px; }
.stack i { display: block; height: 100%; background: var(--cat); }
.chart-wrap { width: 100%; overflow: hidden; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.ax { fill: var(--mute); font-size: 11px; font-family: var(--font); }
.ax.strong { fill: var(--ink-2); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--sub); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--blue); display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--faint) 0 4px, transparent 4px 7px); }
.legend i.proj { background: repeating-linear-gradient(90deg, var(--blue) 0 4px, transparent 4px 7px); opacity: .5; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--fill); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact .k { font-size: 13px; color: var(--sub); }
.fact .v { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.fact .s { font-size: 12px; color: var(--mute); }
.fact .v.warn { color: var(--orange); }
.fact .v.bad { color: var(--red); }
.fact .v.good { color: var(--green); }
.wd { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 96px; margin-top: 6px; }
.wd div { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.wd i { width: 70%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--fill-2); min-height: 3px; }
.wd .top i { background: var(--blue); }
.wd span { font-size: 12px; color: var(--mute); }
.wd .top span { color: var(--blue); font-weight: 700; }

.tips { display: flex; flex-direction: column; gap: 10px; }
.tip { display: flex; gap: 12px; padding: 16px; border-radius: 16px; background: var(--fill); }
.tip .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; background: var(--blue); }
.tip.warn .dot { background: var(--orange); }
.tip.bad .dot { background: var(--red); }
.tip.good .dot { background: var(--green); }
.tip h3 { font-size: 15px; font-weight: 700; line-height: 1.4; }
.tip p { font-size: 14px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
.tip .act { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--blue); }
.ai-box { margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.ai-sum { font-size: 16px; font-weight: 600; line-height: 1.55; margin-bottom: 14px; }
.ai-meta { font-size: 12px; color: var(--mute); margin-top: 12px; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px; padding: 14px 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.ai-badge { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-soft); padding: 3px 8px; border-radius: 6px; }

/* ── 내역 ── */
.day-head { display: flex; justify-content: space-between; padding: 16px 20px 6px; font-size: 13px; color: var(--mute); font-weight: 600; }
.day-head em { font-style: normal; color: var(--blue); margin-left: 6px; }
.del { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); margin-right: -8px; }
.del:hover { background: var(--red-soft); color: var(--red); }
.from-wish { color: var(--green); }

/* ── 탭바: 가운데 + 버튼 ── */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--faint); border-radius: 12px; position: relative; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 99px; background: var(--red); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
.tab-add { justify-self: center; width: 54px; height: 54px; margin-top: -24px; border-radius: 50%; background: var(--blue); color: var(--on-blue); display: grid; place-items: center; box-shadow: 0 8px 18px rgba(49, 130, 246, .42), 0 0 0 5px var(--card); transition: transform .12s; }
.tab-add:active { transform: scale(.92); }
@media (min-width: 520px) and (min-height: 640px) and (hover: hover) and (pointer: fine) and (display-mode: browser) { .tabbar { padding-bottom: 24px; } .screen { padding-bottom: 140px; } }

.snack { position: absolute; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 32px); background: var(--snack); color: var(--on-snack); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; animation: snack .25s ease; box-shadow: 0 10px 24px rgba(0, 0, 0, .18); }
@media (min-width: 520px) and (min-height: 640px) and (hover: hover) and (pointer: fine) and (display-mode: browser) { .snack { bottom: 112px; } }
.snack span { flex: 1; }
.snack .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--blue); color: #fff; flex: none; }
.snack.warn .ic { background: var(--orange); }
.snack.bad .ic { background: var(--red); }
.snack.good .ic { background: var(--green); }
.snack button { color: #8fc0ff; font-weight: 700; }
@keyframes snack { from { opacity: 0; transform: translate(-50%, 10px); } }

.setup { padding: 32px 24px; margin-top: 12%; }
.setup h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.35; }
.setup p { color: var(--sub); margin: 10px 0 28px; }
.loading { height: 260px; display: grid; place-items: center; color: var(--mute); }

/* ── 한 열 고정 (휴대폰 화면 전용) ── */
.cols, .grid2 { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stats dd { font-size: 15px; }
.stats > div + div { padding-left: 10px; }
.wish-row { flex-wrap: wrap; }
.wish-acts { width: 100%; padding-left: 62px; }
.wish-acts .btn { flex: 1; }
@media (max-width: 359px) { .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .facts { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* 4차: 한 달 예산 변경 */
.backup { margin-top: 22px; }
.backup .btn-row .btn { flex: 1; }
.link-btn { color: var(--blue); font-weight: 600; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.cmp { margin: 18px 0 4px; border-radius: 16px; background: var(--fill); padding: 6px 16px; }
.cmp-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: baseline; padding: 11px 0; font-size: 14px; color: var(--sub); }
.cmp-row + .cmp-row { border-top: 1px solid var(--line); }
.cmp-row.head { font-size: 12px; color: var(--mute); padding: 8px 0 2px; }
.cmp-row > span:nth-child(2), .cmp-row > span:nth-child(3) { text-align: right; min-width: 92px; }
.cmp-row .to { color: var(--ink); font-weight: 700; display: flex; flex-direction: column; align-items: flex-end; }
.cmp-row .to small { font-size: 12px; font-weight: 600; margin-top: 2px; }
.cmp-row .to.up small { color: var(--blue); }
.cmp-row .to.down small { color: var(--red); }
.cmp-row .to:not(.up):not(.down) small { color: var(--mute); }
.fit-box { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--orange-soft); color: var(--ink-2); font-size: 14px; line-height: 1.5; cursor: pointer; }
.fit-box input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--blue); flex: none; }
.fit-box small { display: block; margin-top: 4px; color: var(--sub); font-size: 12px; }
.chg-log { margin-top: 18px; }
.chg-log ul { list-style: none; margin: 0; padding: 0; }
.chg-log li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-size: 13px; color: var(--mute); border-top: 1px solid var(--line); }
.chg-log li b { color: var(--ink); }

<script>
// 예산 계산 로직 — 화면과 분리된 순수 함수 (테스트 가능)
(function (root) {
  function pad(n) { return String(n).padStart(2, '0'); }

  function toDateStr(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parts(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return { y, m, d };
  }

  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  function daysLeftInMonth(dateStr) {
    const { y, m, d } = parts(dateStr);
    return daysInMonth(y, m) - d + 1;
  }

  function isValidAmount(v) {
    return typeof v === 'number' && Number.isInteger(v) && v > 0 && v <= 100000000;
  }

  function summary({ budget, expenses, today }) {
    const month = today.slice(0, 7);
    let spentMonth = 0, spentBefore = 0, spentToday = 0;
    for (const e of expenses) {
      if (e.date.slice(0, 7) !== month) continue;
      spentMonth += e.amount;
      if (e.date < today) spentBefore += e.amount;
      else if (e.date === today) spentToday += e.amount;
    }
    const daysLeft = daysLeftInMonth(today);
    const dailyAllowance = Math.max(0, Math.floor((budget - spentBefore) / daysLeft));
    return {
      daysLeft,
      dailyAllowance,
      spentToday,
      todayLeft: dailyAllowance - spentToday,
      spentMonth,
      monthLeft: budget - spentMonth,
    };
  }

  function categoryTotals({ expenses, today }) {
    const month = today.slice(0, 7);
    const map = new Map();
    for (const e of expenses) {
      if (e.date.slice(0, 7) !== month) continue;
      const t = map.get(e.category) || { category: e.category, amount: 0, count: 0 };
      t.amount += e.amount; t.count += 1;
      map.set(e.category, t);
    }
    return [...map.values()].sort((a, b) => b.amount - a.amount);
  }

  // ───────── 2차: 카테고리 봉투 ─────────
  function levelOf(spent, limit) {
    if (!limit) return 'none';
    if (spent > limit) return 'over';
    if (spent >= limit * 0.8) return 'warn';
    return 'ok';
  }

  function envelopes({ budget = 0, limits = {}, expenses, today }) {
    const spentBy = {};
    for (const t of categoryTotals({ expenses, today })) spentBy[t.category] = t.amount;
    const list = [];
    let allocated = 0;
    for (const [category, limit] of Object.entries(limits)) {
      if (!limit || limit <= 0) continue;
      allocated += limit;
      const spent = spentBy[category] || 0;
      list.push({ category, limit, spent, left: limit - spent, pct: Math.round((spent / limit) * 100), level: levelOf(spent, limit) });
    }
    for (const [category, spent] of Object.entries(spentBy)) {
      if (limits[category] > 0) continue;
      list.push({ category, limit: 0, spent, left: 0, pct: 0, level: 'none' });
    }
    return { list, allocated, unallocated: budget - allocated };
  }

  function isValidLimits(budget, limits) {
    let sum = 0;
    for (const v of Object.values(limits)) {
      if (typeof v !== 'number' || !Number.isInteger(v) || v < 0 || v > 100000000) return false;
      sum += v;
    }
    return sum <= budget;
  }

  // ───────── 2차: 24시간 고민 ─────────
  const WAIT_MS = 24 * 60 * 60 * 1000;

  function wishStatus(wish, now) {
    const msLeft = Math.max(0, wish.ts + WAIT_MS - now);
    return { ready: msLeft === 0, msLeft };
  }

  function remainLabel(ms) {
    if (ms <= 0) return '지금 결정';
    const total = Math.ceil(ms / 60000);
    const h = Math.floor(total / 60), m = total % 60;
    if (!h) return m + '분';
    return m ? h + '시간 ' + m + '분' : h + '시간';
  }

  function wishSummary({ wishes, today }) {
    const month = today.slice(0, 7);
    const r = { waitingCount: 0, waitingTotal: 0, savedMonth: 0, savedCount: 0, boughtMonth: 0 };
    for (const w of wishes) {
      if (w.status === 'waiting') { r.waitingCount++; r.waitingTotal += w.price; continue; }
      if (!w.decidedDate || w.decidedDate.slice(0, 7) !== month) continue;
      if (w.status === 'dropped') { r.savedMonth += w.price; r.savedCount++; }
      else if (w.status === 'bought') r.boughtMonth += w.price;
    }
    return r;
  }

  function wishImpact({ limits = {}, expenses, today, category, price }) {
    const limit = limits[category] > 0 ? limits[category] : 0;
    const spent = (categoryTotals({ expenses, today }).find(t => t.category === category) || {}).amount || 0;
    if (!limit) return { limit: 0, leftNow: 0, leftAfter: 0, level: 'none' };
    return { limit, leftNow: limit - spent, leftAfter: limit - spent - price, level: levelOf(spent + price, limit) };
  }


  // ───────── 3차: 그래프용 묶음 ─────────
  function addDays(dateStr, n) {
    const { y, m, d } = parts(dateStr);
    return toDateStr(new Date(y, m - 1, d + n));
  }

  function weekStart(dateStr) {
    const { y, m, d } = parts(dateStr);
    const dow = new Date(y, m - 1, d).getDay(); // 0=일
    return addDays(dateStr, -((dow + 6) % 7));
  }

  function addTo(byCat, e) { byCat[e.category] = (byCat[e.category] || 0) + e.amount; }

  function weeklyTotals({ expenses, today, weeks = 6 }) {
    const cur = weekStart(today);
    const list = [];
    for (let i = weeks - 1; i >= 0; i--) {
      const start = addDays(cur, -7 * i);
      list.push({ start, end: addDays(start, 6), total: 0, byCat: {}, isCurrent: i === 0 });
    }
    const first = list[0].start, last = list[list.length - 1].end;
    for (const e of expenses) {
      if (e.date < first || e.date > last) continue;
      const w = list.find((x) => e.date >= x.start && e.date <= x.end);
      w.total += e.amount; addTo(w.byCat, e);
    }
    return list;
  }

  function shiftMonth(month, n) {
    const [y, m] = month.split('-').map(Number);
    const t = new Date(y, m - 1 + n, 1);
    return t.getFullYear() + '-' + pad(t.getMonth() + 1);
  }

  function monthlyTotals({ expenses, today, months = 6 }) {
    const cur = today.slice(0, 7);
    const list = [];
    for (let i = months - 1; i >= 0; i--) list.push({ month: shiftMonth(cur, -i), total: 0, byCat: {}, isCurrent: i === 0 });
    const idx = new Map(list.map((x, i) => [x.month, i]));
    for (const e of expenses) {
      const i = idx.get(e.date.slice(0, 7));
      if (i === undefined) continue;
      list[i].total += e.amount; addTo(list[i].byCat, e);
    }
    return list;
  }

  function monthDaily({ budget = 0, expenses, today }) {
    const { y, m, d } = parts(today);
    const dim = daysInMonth(y, m);
    const month = today.slice(0, 7);
    const amounts = new Array(d).fill(0);
    for (const e of expenses) {
      if (e.date.slice(0, 7) !== month || e.date > today) continue;
      amounts[parts(e.date).d - 1] += e.amount;
    }
    let cum = 0;
    const days = amounts.map((amount, i) => { cum += amount; return { date: month + '-' + pad(i + 1), day: i + 1, amount, cum }; });
    return { days, dim, pacePerDay: budget / dim };
  }

  // ───────── 3차: 소비 패턴 ─────────
  const IMPULSE_CATS = ['배달', '쇼핑'];
  const WD = ['월', '화', '수', '목', '금', '토', '일'];

  function patterns({ budget = 0, expenses, today }) {
    const { y, m, d } = parts(today);
    const dim = daysInMonth(y, m);
    const month = today.slice(0, 7);
    const cur = expenses.filter((e) => e.date.slice(0, 7) === month && e.date <= today);
    const spentMonth = cur.reduce((a, e) => a + e.amount, 0);
    const avgPerDay = Math.round(spentMonth / d);
    const projected = Math.round((spentMonth / d) * dim);

    const byWeekday = WD.map((label) => ({ label, total: 0, count: 0, days: 0, avg: 0 }));
    for (let i = 1; i <= d; i++) byWeekday[(new Date(y, m - 1, i).getDay() + 6) % 7].days++;
    for (const e of cur) {
      const w = byWeekday[(new Date(y, m - 1, parts(e.date).d).getDay() + 6) % 7];
      w.total += e.amount; w.count++;
    }
    for (const w of byWeekday) w.avg = w.days ? Math.round(w.total / w.days) : 0;
    const topWeekday = byWeekday.filter((w) => w.total > 0).sort((a, b) => b.avg - a.avg)[0] || null;

    const imp = cur.filter((e) => IMPULSE_CATS.includes(e.category));
    const impAmount = imp.reduce((a, e) => a + e.amount, 0);
    const impulse = { amount: impAmount, count: imp.length, share: spentMonth ? Math.round((impAmount / spentMonth) * 100) : 0 };

    const late = cur.filter((e) => { if (!e.ts) return false; const h = new Date(e.ts).getHours(); return h >= 22 || h < 4; });
    const lateNight = { amount: late.reduce((a, e) => a + e.amount, 0), count: late.length };

    const totals = categoryTotals({ expenses: cur, today });
    const top = totals[0] || null;

    const prev = shiftMonth(month, -1);
    const [py, pm] = prev.split('-').map(Number);
    const lastDay = Math.min(d, daysInMonth(py, pm));
    const prevCat = {};
    let lastSame = 0;
    for (const e of expenses) {
      if (e.date.slice(0, 7) !== prev || parts(e.date).d > lastDay) continue;
      lastSame += e.amount; addTo(prevCat, e);
    }
    let rise = null;
    for (const t of totals) {
      const diff = t.amount - (prevCat[t.category] || 0);
      if (diff > 0 && (!rise || diff > rise.diff)) rise = { category: t.category, diff };
    }

    return {
      budget, today, elapsed: d, dim, count: cur.length, spentMonth, avgPerDay, projected,
      projectedOver: projected - budget, byWeekday, topWeekday, impulse, lateNight, top, totals,
      lastSame, diffLast: spentMonth - lastSame, rise,
    };
  }

  function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }

  function adviceRules(p) {
    if (!p.spentMonth) return [{ id: 'empty', tone: 'info', title: '기록이 쌓이면 패턴을 알려드려요', body: '결제할 때마다 바로 기록해보세요. 일주일 정도 모이면 요일·시간대·카테고리별 습관이 보여요.' }];
    const tips = [];
    if (p.budget && p.projectedOver > 0) {
      tips.push({ id: 'over', tone: 'bad', title: '이 속도면 월말에 ' + won(p.projectedOver) + ' 넘어요',
        body: p.spentMonth >= p.budget
          ? '이미 예산을 ' + won(p.spentMonth - p.budget) + ' 넘었어요. 남은 ' + (p.dim - p.elapsed) + '일은 꼭 필요한 지출만 하고, 다음 달 예산을 다시 잡아봐요.'
          : '하루 평균 ' + won(p.avgPerDay) + '씩 쓰고 있어요. 남은 ' + (p.dim - p.elapsed + 1) + '일 동안 하루 ' + won(Math.floor((p.budget - p.spentMonth) / (p.dim - p.elapsed + 1))) + '에 맞추면 지킬 수 있어요.' });
    }
    if (p.impulse.share >= 30 && p.impulse.amount > 0) {
      tips.push({ id: 'impulse', tone: 'warn', title: '배달·쇼핑이 지출의 ' + p.impulse.share + '%예요',
        body: p.impulse.count + '번에 ' + won(p.impulse.amount) + '을 썼어요. 사고 싶은 게 생기면 24시간 고민함에 먼저 넣어보세요.' });
    }
    if (p.lateNight.count >= 2) {
      tips.push({ id: 'night', tone: 'warn', title: '밤 10시 이후에 ' + p.lateNight.count + '번 결제했어요',
        body: '늦은 밤 지출이 ' + won(p.lateNight.amount) + '이에요. 밤에는 앱 장바구니만 담고 결제는 다음 날 하는 규칙을 추천해요.' });
    }
    if (p.rise && p.lastSame > 0 && p.rise.diff >= 10000) {
      tips.push({ id: 'rise', tone: 'warn', title: '지난달 이맘때보다 ' + p.rise.category + '가 ' + won(p.rise.diff) + ' 늘었어요',
        body: '지난달 같은 기간 ' + won(p.lastSame) + ' → 이번 달 ' + won(p.spentMonth) + '이에요.' });
    }
    if (p.topWeekday && p.count >= 5 && p.topWeekday.total >= 10000 && p.topWeekday.avg >= p.avgPerDay * 1.5) {
      tips.push({ id: 'weekday', tone: 'info', title: p.topWeekday.label + '요일에 가장 많이 써요',
